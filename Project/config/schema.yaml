from typing import List, Optional
from pydantic import BaseModel, Field

# ----------------------------------------------------

# SCOREBOARD INFORMATION

# ----------------------------------------------------

class ScoreboardData(BaseModel):
score: str
wickets: int
overs: str
batting_team: Optional[str] = None
bowling_team: Optional[str] = None
striker: Optional[str] = None
non_striker: Optional[str] = None
bowler: Optional[str] = None

# ----------------------------------------------------

# AUDIO ANALYSIS

# ----------------------------------------------------

class AudioData(BaseModel):
timestamp: float
commentary_text: str
crowd_intensity: float = Field(
ge=0.0,
le=1.0
)

# ----------------------------------------------------

# VIDEO FRAME DATA

# ----------------------------------------------------

class FrameData(BaseModel):
frame_id: int
timestamp: float
frame_path: str

# ----------------------------------------------------

# DETECTED EVENT

# ----------------------------------------------------

class EventData(BaseModel):
event_id: str
timestamp: float

```
event_type: str
confidence: float

player_name: Optional[str] = None

scoreboard: Optional[ScoreboardData] = None

commentary: Optional[str] = None

crowd_score: Optional[float] = None
```

# ----------------------------------------------------

# HIGHLIGHT SCORE

# ----------------------------------------------------

class RankedEvent(BaseModel):
event_id: str
event_type: str
timestamp: float

```
importance_score: float

explanation: Optional[str] = None
```

# ----------------------------------------------------

# VIDEO CLIP

# ----------------------------------------------------

class HighlightClip(BaseModel):
clip_id: str

```
start_time: float
end_time: float

event_type: str

title: str

importance_score: float

output_path: Optional[str] = None
```

# ----------------------------------------------------

# NARRATION

# ----------------------------------------------------

class Narrative(BaseModel):
event_id: str

```
title: str

narration_text: str

subtitle_text: Optional[str] = None
```

# ----------------------------------------------------

# FINAL OUTPUT

# ----------------------------------------------------

class HighlightReel(BaseModel):
video_name: str

```
total_events: int

clips: List[HighlightClip]

output_video_path: str

generated_at: str
```

# ----------------------------------------------------

# AGENT RESPONSE

# ----------------------------------------------------

class AgentResponse(BaseModel):
success: bool

```
message: str

data: Optional[dict] = None
```

# ----------------------------------------------------

# MCP REQUEST

# ----------------------------------------------------

class VideoRequest(BaseModel):
video_path: str

class EventRequest(BaseModel):
video_path: str
timestamp: float

# ----------------------------------------------------

# OCR RESPONSE

# ----------------------------------------------------

class OCRResponse(BaseModel):
timestamp: float

```
scoreboard: ScoreboardData
```

# ----------------------------------------------------

# AUDIO RESPONSE

# ----------------------------------------------------

class AudioResponse(BaseModel):
timestamp: float

```
audio_data: AudioData
```

# ----------------------------------------------------

# EVENT RESPONSE

# ----------------------------------------------------

class EventResponse(BaseModel):
events: List[EventData]

# ----------------------------------------------------

# RANKING RESPONSE

# ----------------------------------------------------

class RankingResponse(BaseModel):
ranked_events: List[RankedEvent]
